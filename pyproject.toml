[project]
name = "movie-recommender"
version = "0.1.0"
description = "Movie recommendation system built step by step as a machine learning study project"
authors = [{ name = "Kevin Thiago dos Santos" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "mlflow>=2.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "joblib>=1.4.0",
]

[dependency-groups]
notebooks = [
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
]
dev = [
    { include-group = "notebooks" },
    { include-group = "test" },
]

[tool.uv]
# Phase 0: the code still lives in the top-level `src` package and is run with `python -m src...`.
# Phase 1 moves it to `src/movie_recommender/` and turns this into an installable package.
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
